<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla sign-in code</title>
<style>body{font-family:-apple-system,sans-serif;padding:24px}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;font-size:15px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style></head>
<body><h2>Tesla authorization</h2><p id="msg">Reading code…</p><code id="code"></code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<script>var p=new URLSearchParams(location.search);var c=p.get('code'),e=p.get('error');document.getElementById('msg').textContent=c?'Copy this code and paste it into the secure card in your Grok Bot chat.':(e?('Error: '+e+' '+(p.get('error_description')||'')):'No code found in this link.');document.getElementById('code').textContent=c||'';</script></body></html>
